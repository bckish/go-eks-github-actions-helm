name: Go service validation
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./... && go test -race -cover ./...
      - run: docker build -t go-eks-api:ci .
      - run: helm lint chart && helm template go-lab chart > /dev/null
